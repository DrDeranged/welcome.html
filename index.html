<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARG — Welcome Arsenal Funding</title>
<link rel="icon" href="data:,">
<style>
  /* One-off welcome display for a second TV. Full-screen poster, nothing else.
     webOS-safe: no grid, no gap, no inset, ES2015-only JS. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #0a1128; overflow: hidden; }
  body.hide-cursor, body.hide-cursor * { cursor: none; }
  .wrap {
    width: 100%; height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  .wrap img { max-width: 100%; max-height: 100%; }
</style>
</head>
<body>
<div class="wrap">
  <img src="welcome.jpg" alt="Welcome Arsenal Funding — ARG">
</div>
<script>
  var cursorTimer = null;
  function armCursorHide() {
    document.body.classList.remove("hide-cursor");
    if (cursorTimer) clearTimeout(cursorTimer);
    cursorTimer = setTimeout(function () { document.body.classList.add("hide-cursor"); }, 5000);
  }
  document.addEventListener("mousemove", armCursorHide);
  armCursorHide();
  (function scheduleNightlyReload() {
    var now = new Date();
    var next = new Date(now);
    next.setHours(4, 0, 0, 0);
    if (next <= now) next.setDate(next.getDate() + 1);
    setTimeout(function () { location.reload(); }, next - now);
  })();
</script>
</body>
</html>
